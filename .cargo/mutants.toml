# What `cargo mutants` does here.
#
# CONTRIBUTING.md asks for a strengthened assertion to be verified by breaking
# the thing it guards and watching it fail by name. That was done by hand, one
# edit at a time, which meant a handful of breakages got tried per change and
# the rest were never asked about. This asks about all of them.
#
# `nextest` rather than `cargo test`, because a mutant is one build and one
# test run and this workspace has forty test binaries for nextest to run at
# once.
test_tool = "nextest"

# Every package's tests, not only the one the mutant is in. That is the default
# and it is wrong here: the compiler crates are thin and most of what holds
# them lives in `deed-driver`, which drives the whole pipeline. Mutating
# `deed-typeck` ran its own 107 tests and none of `deed-driver`'s 504, one of
# which was written to catch exactly the mutation that came back MISSED.
test_workspace = true

# No debug symbols. A mutant is expected to fail a test, and the name of the
# test is what says which one, so the symbols are paid for on every build and
# read on none.
profile = "mutants"

# Doctests are a separate binary each and there are eight of them.
additional_cargo_test_args = ["--all-targets"]

# Long enough that a mutant caught late is caught rather than killed.
#
# The default is five times the baseline test run, with a floor of twenty
# seconds, and the baseline here reports `0s test`: with `--in-diff` and a
# shard there is nothing for it to measure, so every run takes the floor. The
# suite needs about twenty-three seconds to reach its last test, so a mutant
# that only some test near the end has an opinion about was killed at twenty
# and reported as a timeout.
#
# That is the worst possible failure for this gate, because a timeout is read
# here as a miss: an unread mutant is one nothing has an opinion about, and the
# whole point of the job is to say so. A caught mutant wearing that word makes
# the number meaningless in the direction of more work rather than less.
#
# Measured 2026-08-09, on the run that found it: `&&` to `||` in
# `facts::round_down` fails `an_open_end_divided_by_minus_one_stays_open`
# at 22.7s of a 23s run, and CI called it a timeout.
#
# This raises the floor rather than fixing the timeout, so a workspace whose
# baseline is ever measured properly still gets a timeout derived from it.
minimum_test_timeout = 120
