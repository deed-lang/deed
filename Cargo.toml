[workspace]
resolver = "3"
members = [
    "crates/deed-ast",
    "crates/deed-cli",
    "crates/deed-codegen",
    "crates/deed-diagnostics",
    "crates/deed-driver",
    "crates/deed-effects",
    "crates/deed-fmt",
    "crates/deed-interp",
    "crates/deed-lexer",
    "crates/deed-lsp",
    "crates/deed-mir",
    "crates/deed-parser",
    "crates/deed-resolve",
    "crates/deed-rt",
    "crates/deed-typeck",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/deed-lang/deed"
rust-version = "1.85"

[workspace.lints.clippy]
all = "warn"

# For `cargo mutants`, which builds the tree once per mutant. A mutant is meant
# to fail a test, and the test's name is what says which one, so debug symbols
# are paid for on every build and read on none.
[profile.mutants]
inherits = "test"
debug = "none"
