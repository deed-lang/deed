[workspace]
resolver = "3"
members = [
    "crates/deed-ast",
    "crates/deed-cli",
    "crates/deed-codegen",
    "crates/deed-dap",
    "crates/deed-diagnostics",
    "crates/deed-driver",
    "crates/deed-effects",
    "crates/deed-explain",
    "crates/deed-fetch",
    "crates/deed-fmt",
    "crates/deed-interp",
    "crates/deed-lexer",
    "crates/deed-lsp",
    "crates/deed-mcp",
    "crates/deed-mir",
    "crates/deed-parser",
    "crates/deed-resolve",
    "crates/deed-rt",
    "crates/deed-typeck",
    "crates/deed-wasm",
]

[workspace.package]
version = "0.2.12"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/deed-lang/deed"
rust-version = "1.88"

# Publishing needs a version next to every path, or `cargo publish` refuses,
# and a version repeated in twenty manifests is nineteen places to forget. So
# the internal dependencies are declared once here and each crate says
# `deed-x.workspace = true`. These have to equal the version above, and
# `crates/deed-driver/tests/publishing.rs` says so rather than trusting it.
[workspace.dependencies]
deed-ast = { path = "crates/deed-ast", version = "0.2.12" }
deed-codegen = { path = "crates/deed-codegen", version = "0.2.12" }
deed-dap = { path = "crates/deed-dap", version = "0.2.12" }
deed-diagnostics = { path = "crates/deed-diagnostics", version = "0.2.12" }
deed-driver = { path = "crates/deed-driver", version = "0.2.12" }
deed-effects = { path = "crates/deed-effects", version = "0.2.12" }
deed-explain = { path = "crates/deed-explain", version = "0.2.12" }
deed-fetch = { path = "crates/deed-fetch", version = "0.2.12" }
deed-fmt = { path = "crates/deed-fmt", version = "0.2.12" }
deed-interp = { path = "crates/deed-interp", version = "0.2.12" }
deed-lexer = { path = "crates/deed-lexer", version = "0.2.12" }
deed-lsp = { path = "crates/deed-lsp", version = "0.2.12" }
deed-mcp = { path = "crates/deed-mcp", version = "0.2.12" }
deed-mir = { path = "crates/deed-mir", version = "0.2.12" }
deed-parser = { path = "crates/deed-parser", version = "0.2.12" }
deed-resolve = { path = "crates/deed-resolve", version = "0.2.12" }
deed-rt = { path = "crates/deed-rt", version = "0.2.12" }
deed-typeck = { path = "crates/deed-typeck", version = "0.2.12" }
deed-wasm = { path = "crates/deed-wasm", version = "0.2.12" }

[workspace.lints.clippy]
all = "warn"

# For `cargo mutants`, which builds the tree once per mutant. A mutant is meant
# to fail a test, and the test's name is what says which one, so debug symbols
# are paid for on every build and read on none.
[profile.mutants]
inherits = "test"
debug = "none"

# For `deed-wasm`'s release artifact (#592). A page waits on this download
# before it can do anything, so it is tuned for size rather than speed: `z`
# over `3`, one codegen unit over parallelism, symbols and the panic
# unwinder both cut. None of this touches `deed`'s own release profile,
# which stays tuned for the opposite trade.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

