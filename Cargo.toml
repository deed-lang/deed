[workspace]
resolver = "3"
members = [
    "crates/deed-ast",
    "crates/deed-cli",
    "crates/deed-diagnostics",
    "crates/deed-driver",
    "crates/deed-effects",
    "crates/deed-fmt",
    "crates/deed-interp",
    "crates/deed-lexer",
    "crates/deed-lsp",
    "crates/deed-parser",
    "crates/deed-resolve",
    "crates/deed-typeck",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/onatozmenn/deed"
rust-version = "1.85"

[workspace.lints.clippy]
all = "warn"
