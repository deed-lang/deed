[package]
name = "deed-cli"
description = "The deed command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "deed"
path = "src/main.rs"

[dependencies]
deed-ast.workspace = true
deed-diagnostics.workspace = true
deed-codegen.workspace = true
deed-dap.workspace = true
deed-driver.workspace = true
deed-explain.workspace = true
deed-fetch.workspace = true
deed-mir.workspace = true
deed-fmt.workspace = true
deed-interp.workspace = true
# `deed new` refuses a name the language could not hold. A second keyword list
# here would be a list that drifts.
deed-lexer.workspace = true
deed-lsp.workspace = true
deed-mcp.workspace = true
deed-rt.workspace = true
deed-typeck.workspace = true

[dev-dependencies]
# The artifact a page and an agent run, held against this binary by
# `tests/surfaces.rs`. A dev-dependency because nothing the tool does at run
# time goes through it.
deed-wasm.workspace = true

[lints]
workspace = true
