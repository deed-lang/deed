[package]
name = "deed-cli"
description = "The deed command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "deed"
path = "src/main.rs"

[dependencies]
deed-ast = { path = "../deed-ast" }
deed-diagnostics = { path = "../deed-diagnostics" }
deed-codegen = { path = "../deed-codegen" }
deed-driver = { path = "../deed-driver" }
deed-explain = { path = "../deed-explain" }
deed-fetch = { path = "../deed-fetch" }
deed-mir = { path = "../deed-mir" }
deed-fmt = { path = "../deed-fmt" }
deed-interp = { path = "../deed-interp" }
deed-lsp = { path = "../deed-lsp" }
deed-mcp = { path = "../deed-mcp" }
deed-rt = { path = "../deed-rt" }
deed-typeck = { path = "../deed-typeck" }

[dev-dependencies]
# The artifact a page and an agent run, held against this binary by
# `tests/surfaces.rs`. A dev-dependency because nothing the tool does at run
# time goes through it.
deed-wasm = { path = "../deed-wasm" }

[lints]
workspace = true
